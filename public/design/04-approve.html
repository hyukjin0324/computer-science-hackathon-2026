<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<meta charset="utf-8">
<title>Bento 승인 시트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#17181C}a:hover{color:#3A3D44}
</style>
<title>Bento 시안 · ④ 승인 시트</title>
<style>html,body{margin:0;padding:0} body{width:390px;min-height:844px}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8C8D8A; color: #17181C; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; left: 20px; right: 20px; top: 24px; display: flex; flex-direction: column; gap: 12px; opacity: .45">
    <div style="height: 40px; width: 220px; border-radius: 999px; background: #FFFFFF"></div>
    <div style="height: 64px; width: 260px; border-radius: 12px; background: #ECEDE8"></div>
    <div style="height: 150px; border-radius: 22px; background: #17181C"></div>
  </div>

  <section aria-label="승인 시트" style="position: relative; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 20px 22px; display: flex; flex-direction: column; gap: 14px">
    <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 99px; background: #DEDFD9; align-self: center"></div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: #FFF1C7; color: #6B4E00; font-size: 12.5px; font-weight: 700">확인이 필요해요</span>
      <h1 style="margin: 4px 0 0; font-size: 22px; line-height: 1.35; font-weight: 800; letter-spacing: -0.5px">늦어진 계획 다시 짜기</h1>
      <p style="margin: 0; font-size: 14px; color: #5B5F66">승인하면 Bento가 GitHub에서 바로 실행해요</p>
    </div>

    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <li>
        <label for="s1" style="display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; padding: 12px 14px; border-radius: 16px; background: #F5F5F1; cursor: pointer">
          <input id="s1" type="checkbox" checked="" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #17181C">
          <span><b style="display: block; font-size: 15px">'MVP' 마감 미루기</b><small style="font-size: 13px; color: #5B5F66">11/19 14:00 → 11/21 01:00</small></span>
        </label>
      </li>
      <li>
        <label for="s2" style="display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; padding: 12px 14px; border-radius: 16px; background: #F5F5F1; cursor: pointer">
          <input id="s2" type="checkbox" checked="" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #17181C">
          <span><b style="display: block; font-size: 15px">#13 README 담당 → hajun</b><small style="font-size: 13px; color: #5B5F66">지금 맡은 열린 이슈가 가장 적어요</small></span>
        </label>
      </li>
      <li>
        <label for="s3" style="display: grid; grid-template-columns: 24px 1fr; gap: 12px; align-items: start; padding: 12px 14px; border-radius: 16px; background: #F5F5F1; cursor: pointer">
          <input id="s3" type="checkbox" checked="" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #17181C">
          <span><b style="display: block; font-size: 15px">디스코드에 바뀐 계획 알리기</b><small style="font-size: 13px; color: #5B5F66">보내기 전에 문장을 고칠 수 있어요</small></span>
        </label>
      </li>
    </ul>

    <details style="border-top: 1px solid #ECEDE8; padding-top: 10px">
      <summary style="font-size: 14px; font-weight: 700; color: #3A3D44; cursor: pointer; min-height: 32px; display: flex; align-items: center">근거 보기 · 커밋 c0ffee1 · 이슈 4개</summary>
      <p style="margin: 6px 0 0; font-size: 13px; line-height: 1.6; color: #5B5F66">MVP 마일스톤: 열린 이슈 4개, 닫힌 이슈 1개, 마감 10시간 지남. 제출 마감 11/24 12:00에서 거꾸로 다시 배치했어요.</p>
    </details>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3A3D44">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
      실행 직전에 저장소를 다시 확인해요 · 모두 되돌릴 수 있어요
    </div>

    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
      <button type="button" style="height: 56px; border: 1px solid #DEDFD9; border-radius: 999px; background: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; color: #17181C">나중에</button>
      <button type="button" style="height: 56px; border: 0; border-radius: 999px; background: #17181C; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 700">승인하고 실행 (3)</button>
    </div>
  </section>
</div>
</body>
</html>
