.contest-meta { display:flex; gap:4px 8px; flex-wrap:wrap; margin-top:4px; }

.day-chip { color:var(--due); background:var(--due-bg); } .day-chip.soon { color:var(--fail); background:var(--fail-bg); }
.contest-result { display:grid; grid-template-columns:36px minmax(0,1fr) 18px; align-items:center; gap:8px; box-sizing:border-box; background:var(--paper); color:var(--ink); border:1px solid var(--line); border-radius:16px; padding:10px 14px; text-align:left; font:inherit; }
.contest-result strong { font-size:14.5px; line-height:1.38; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.contest-meta + small { display:block; margin-top:4px; color:var(--muted); }
.e6-results { display:flex; flex-direction:column; gap:8px; }
.e6-summary { padding:8px 12px; background:var(--soft); border-radius:14px; font-size:14px; }
.e6-row { display:grid; grid-template-columns:24px minmax(0,1fr); gap:8px; padding:8px 0; }
.e6-row + .e6-row { border-top:1px solid var(--line); }
.e6-row strong { font-size:13.5px; } .e6-status { font-size:12px; font-weight:700; color:var(--status); margin-left:8px; }
.e6-row small { color:var(--muted); display:block; font-size:12.5px; line-height:1.52; margin:1px 0; }
.e6-state { display:grid; width:24px; height:24px; border-radius:50%; place-items:center; background:var(--status-bg); color:var(--status); }
.e6-row.ok { --status:var(--ok); --status-bg:var(--ok-bg); }
.e6-row.warn { --status:var(--warn); --status-bg:var(--warn-bg); }
.e6-row.fail { --status:var(--fail); --status-bg:var(--fail-bg); }
.e6-link { display:inline-block; color:var(--info); font-size:13px; padding:4px 0; text-underline-offset:2px; }
.source-evidence { display:flex; flex-direction:column; gap:8px; border-radius:14px; padding:12px; background:var(--info-bg); color:var(--ink); font-size:13px; }
.source-heading, .source-evidence .e6-btn { color:var(--info); }
.source-evidence .e6-btn { border-color:var(--info); background:transparent; }
.source-details summary { cursor:pointer; min-height:44px; display:flex; align-items:center; justify-content:space-between; gap:8px; list-style:none; }
.source-details summary::-webkit-details-marker { display:none; }
.source-details[open] summary svg { transform:rotate(180deg); }
.source-links { display:flex; flex-direction:column; padding-left:8px; }
.e6-btn { min-height:44px; box-sizing:border-box; border:1px solid var(--line); border-radius:999px; background:var(--paper); color:var(--ink); font:inherit; font-weight:700; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:6px; padding:8px 14px; }
.e6-btn.primary { background:var(--primary); color:var(--primary-ink); border-color:transparent; }
.apply-card { display:grid; gap:12px; background:var(--paper); border:1px solid var(--line); border-radius:20px; padding:16px; font-size:14px; }
.apply-card > p, .deadline-row { color:var(--muted); font-size:13px; }
.apply-card > .e6-link { justify-self:start; }
.question-group { border:0 !important; padding:0 !important; }
.question-group > div:first-child { display:none; }</style>
